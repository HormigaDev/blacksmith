# Blacksmith · TLS (perfil «intermediate» de Mozilla: TLS 1.2 y 1.3, compatible con todos
# los navegadores actuales). El certificado lo declara cada sitio.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:BLACKSMITH_TLS:10m;
ssl_session_timeout 1d;
# Sin tickets: con su clave fija romperían el secreto perfecto hacia adelante.
ssl_session_tickets off;
