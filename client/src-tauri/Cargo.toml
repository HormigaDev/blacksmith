[package]
name = "client"
version.workspace = true
description = "A Tauri App"
authors.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Mismas reglas estrictas que el agente: sin unwrap/expect/panic ni unsafe en producción.
[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "=2.8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared = { path = "../../shared" }
# Túnel SSH (src/ssh). Versiones exactas y con al menos 7 días publicadas: misma política que
# las dependencias npm (client/docs/components.md §6).
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa"] }
keyring-core = "=1.0.1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
thiserror = "2"
zeroize = { version = "1", features = ["serde"] }
# Bóveda de credenciales (src/secrets): las mismas versiones que ya usa russh, sin criptografía nueva.
aes-gcm = "=0.11.1"
getrandom = "0.4"
sha2 = "0.11"
data-encoding = "2"
# Logs en tiempo real (WebSocket del agente). Las mismas versiones que ya usa el agente.
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# GitHub (src/github): HTTPS desde Rust, porque la webview no puede salir a internet (CSP). TLS con
# rustls + ring (la misma criptografía que russh, sin aws-lc ni C) y los certificados raíz del
# sistema operativo.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# Llavero del sistema operativo: Secret Service (GNOME Keyring, KWallet) por D-Bus en Rust puro.
[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", features = ["rt-tokio-crypto-rust"] }

# Llavero del sistema operativo: Administrador de credenciales de Windows.
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "=1.1.0"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tempfile = "3"
