# API HTTP (REST, GraphQL): límite de peticiones por IP, cuerpos de hasta 10 MB y tiempos cortos
# contra clientes lentos. El servicio escucha en {{upstream}}.
#
# Cuerpo del `server`: el agente añade lo demás (puertos, HTTPS, desafío ACME, cabeceras de
# seguridad, logs). Variables: {{upstream}} · {{root}} · {{service}} · {{server_names}} · {{primary}}.

client_max_body_size 10m;
client_body_timeout 15s;
client_header_timeout 15s;

location / {
    limit_req zone=blacksmith_api burst=40 nodelay;
    limit_conn blacksmith_conn 50;
    include snippets/blacksmith/proxy.conf;
    proxy_pass http://{{upstream}};
}
