# Sitio estático: sirve la carpeta pública del despliegue (p. ej. `dist/`).
#
# Cuerpo del `server`: el agente añade lo demás (puertos, HTTPS, desafío ACME, cabeceras de
# seguridad, logs). Variables: {{root}} carpeta pública de la versión activa · {{upstream}}
# 127.0.0.1:<puerto> · {{service}} · {{server_names}} · {{primary}}.

root {{root}};
index index.html;
include snippets/bbel/static.conf;

location / {
    # /docs → docs.html o docs/index.html
    try_files $uri $uri.html $uri/ =404;
}
