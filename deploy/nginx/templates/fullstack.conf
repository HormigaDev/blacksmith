# Frontend estático (SPA) + API del mismo servicio: los archivos salen de la carpeta pública y
# /api/ y /ws van al servicio, que escucha en {{upstream}}.
#
# Cuerpo del `server`: el agente añade lo demás (puertos, HTTPS, desafío ACME, cabeceras de
# seguridad, logs). Variables: {{root}} · {{upstream}} · {{service}} · {{server_names}} · {{primary}}.

root {{root}};
index index.html;
include snippets/blacksmith/static.conf;
client_max_body_size 10m;

# `^~`: estas rutas nunca caen en las reglas de archivos estáticos.
location ^~ /api/ {
    limit_req zone=blacksmith_api burst=40 nodelay;
    limit_conn blacksmith_conn 50;
    include snippets/blacksmith/proxy.conf;
    proxy_pass http://{{upstream}};
}

location ^~ /ws {
    limit_conn blacksmith_conn 200;
    include snippets/blacksmith/proxy.conf;
    include snippets/blacksmith/websocket.conf;
    proxy_pass http://{{upstream}};
}

location = /index.html {
    include snippets/blacksmith/security-headers.conf;
    add_header Cache-Control "no-cache" always;
}

location / {
    try_files $uri $uri/ /index.html;
}
