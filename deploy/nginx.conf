# BBEL Blacksmith: proxy inverso para los webhooks de GitHub.
#
# Es la ÚNICA superficie pública del sistema: solo se reenvía `POST /api/webhooks/github`. La
# administración nunca pasa por aquí; va por túnel SSH directo a 127.0.0.1:4040. Como defensa en
# profundidad, el agente devuelve 404 en las rutas de administración a cualquier petición que
# traiga X-Forwarded-For / X-Real-IP / Forwarded, y Nginx siempre las añade.
#
# Instalación:
#   cp deploy/nginx.conf /etc/nginx/conf.d/blacksmith.conf   # se incluye dentro de http {}
#   Sustituya hooks.example.com y las rutas del certificado; luego: nginx -t && systemctl reload nginx
#
# Mantenga client_max_body_size alineado con BLACKSMITH_BODY_LIMIT_BYTES (1 MiB por defecto).

# 10 MB de estado son unas 160 000 IPs. GitHub envía ráfagas cortas desde pocas IPs.
limit_req_zone  $binary_remote_addr zone=blacksmith_webhooks:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=blacksmith_conn:10m;

upstream blacksmith_agent {
    server 127.0.0.1:4040;
    keepalive 4;
}

# Peticiones con un Host desconocido: se cierran sin responder y sin presentar certificado.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# HTTP: solo el reto ACME. Nada de redirigir a HTTPS: un webhook por HTTP plano es un error de
# configuración y debe fallar de forma visible, no seguir una redirección.
server {
    listen 80;
    listen [::]:80;
    server_name hooks.example.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 444;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hooks.example.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/hooks.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hooks.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:BlacksmithTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;

    # Timeouts y límites cortos contra slowloris: GitHub corta a los 10 s.
    client_max_body_size 1m;
    client_body_buffer_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    location = /api/webhooks/github {
        limit_except POST {
            deny all;
        }
        limit_req zone=blacksmith_webhooks burst=20 nodelay;
        limit_conn blacksmith_conn 10;
        limit_req_status 429;
        limit_conn_status 429;

        # Opcional: restringir a los rangos `hooks` de https://api.github.com/meta. Requiere
        # mantener la lista actualizada; la firma HMAC sigue siendo la autenticación real.
        # include /etc/nginx/snippets/github-hooks-allow.conf;
        # deny all;

        proxy_pass http://blacksmith_agent;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        # Se sobrescriben, no se encadenan ($proxy_add_x_forwarded_for): el valor que mande el
        # cliente nunca llega al agente.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;
        proxy_set_header Forwarded         "";
        proxy_set_header Authorization     "";
        proxy_set_header Cookie            "";

        # Nginx recibe el cuerpo entero antes de abrir la conexión con el agente.
        proxy_request_buffering on;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 15s;
    }

    location / {
        return 404;
    }
}
