# Aplicación web servida por el propio servicio (Node, Next/Nuxt/SvelteKit con SSR, Django,
# Rails, Go…), con WebSocket transparente. El servicio escucha en {{upstream}}.
#
# Cuerpo del `server`: el agente añade lo demás (puertos, HTTPS, desafío ACME, cabeceras de
# seguridad, logs). Variables: {{upstream}} · {{root}} · {{service}} · {{server_names}} · {{primary}}.

client_max_body_size 25m;

location / {
    limit_conn blacksmith_conn 100;
    include snippets/blacksmith/proxy.conf;
    proxy_pass http://{{upstream}};
}
