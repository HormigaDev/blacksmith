# BBEL Blacksmith: webhooks de GitHub hacia el agente.
#
# Es la ÚNICA superficie pública del propio Blacksmith: solo se reenvía `POST /api/webhooks/github`.
# La administración nunca pasa por aquí; va por túnel SSH directo a 127.0.0.1:4040. Como defensa
# en profundidad, el agente devuelve 404 en las rutas de administración a cualquier petición que
# traiga X-Forwarded-For / X-Real-IP / Forwarded, y nginx siempre las añade.
#
# Requiere la integración de nginx (deploy/nginx/install.sh: snippets, servidores por defecto y
# desafío ACME). Instalación:
#   sed 's/hooks.example.com/SU-DOMINIO/g' deploy/nginx/webhooks.conf > /etc/nginx/conf.d/blacksmith-webhooks.conf
#   certbot certonly --webroot -w /var/lib/bbel-acme -d SU-DOMINIO
#   nginx -t && systemctl reload nginx
#
# Mantenga client_max_body_size alineado con BLACKSMITH_BODY_LIMIT_BYTES (1 MiB por defecto).

# GitHub envía ráfagas cortas desde pocas IPs.
limit_req_zone $binary_remote_addr zone=blacksmith_webhooks:10m rate=10r/s;

upstream blacksmith_agent {
    server 127.0.0.1:4040;
    keepalive 4;
}

# HTTP: solo el desafío ACME. Sin redirección a HTTPS: un webhook por HTTP plano es un error de
# configuración y debe fallar de forma visible, no seguir una redirección.
server {
    listen 80;
    listen [::]:80;
    server_name hooks.example.com;
    include snippets/bbel/acme.conf;

    location / {
        return 444;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hooks.example.com;

    ssl_certificate     /etc/letsencrypt/live/hooks.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hooks.example.com/privkey.pem;
    include snippets/bbel/tls.conf;
    include snippets/bbel/security-headers.conf;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # Timeouts y límites cortos contra slowloris: GitHub corta a los 10 s.
    client_max_body_size 1m;
    client_body_buffer_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    location = /api/webhooks/github {
        limit_except POST {
            deny all;
        }
        limit_req zone=blacksmith_webhooks burst=20 nodelay;
        limit_conn bbel_conn 10;

        # Opcional: restringir a los rangos `hooks` de https://api.github.com/meta. Requiere
        # mantener la lista actualizada; la firma HMAC sigue siendo la autenticación real.
        # include /etc/nginx/snippets/github-hooks-allow.conf;
        # deny all;

        proxy_pass http://blacksmith_agent;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        # Se sobrescriben, no se encadenan ($proxy_add_x_forwarded_for): el valor que mande el
        # cliente nunca llega al agente.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;
        proxy_set_header Forwarded         "";
        proxy_set_header Authorization     "";
        proxy_set_header Cookie            "";

        # nginx recibe el cuerpo entero antes de abrir la conexión con el agente.
        proxy_request_buffering on;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 15s;
    }

    location / {
        return 404;
    }
}
