# BBEL Blacksmith · servidores por defecto. Una petición con un Host que ningún sitio declara
# (escaneos por IP, dominios ajenos apuntando aquí) se cierra sin responder y, por HTTPS, sin
# presentar ningún certificado. install.sh solo lo instala si no hay otro `default_server`.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# `http2` como en los sitios: nginx exige las mismas opciones en cada dirección.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}
