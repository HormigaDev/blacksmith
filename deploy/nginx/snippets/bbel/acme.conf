# BBEL Blacksmith · desafío HTTP-01 de Let's Encrypt (certbot --webroot). Solo esta ruta y solo
# archivos de texto del directorio de desafíos; el resto del sitio sigue su configuración.
location ^~ /.well-known/acme-challenge/ {
    root /var/lib/bbel-acme;
    default_type text/plain;
    try_files $uri =404;
}
