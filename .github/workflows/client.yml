# CI del cliente. Es también el ENTORNO CANÓNICO de la regresión visual: las capturas de
# referencia (client/e2e/__screenshots__) se validan aquí en cada cambio y, si hay que
# regenerarlas, se generan aquí (workflow_dispatch con update_snapshots). Ver client/docs/testing.md.
#
# Las acciones se fijan por SHA de commit (las etiquetas se pueden mover): actualizar a conciencia.
name: client

on:
    push:
        branches: [master]
        paths: ['client/**', 'shared/**', '.github/workflows/client.yml']
    pull_request:
        paths: ['client/**', 'shared/**', '.github/workflows/client.yml']
    workflow_dispatch:
        inputs:
            update_snapshots:
                description: 'Regenerar las capturas de referencia (se publican como artefacto)'
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: client-${{ github.ref }}
    cancel-in-progress: true

defaults:
    run:
        working-directory: client

env:
    CI: 'true'

jobs:
    check:
        name: Tipos, estilos, i18n y tests (unitarios + componentes)
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  package_json_file: client/package.json
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: client/.node-version
                  cache: pnpm
                  cache-dependency-path: client/pnpm-lock.yaml
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright install --with-deps chromium
            - run: pnpm check

    e2e:
        name: E2E (Chromium + WebKit) y accesibilidad
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  package_json_file: client/package.json
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: client/.node-version
                  cache: pnpm
                  cache-dependency-path: client/pnpm-lock.yaml
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright install --with-deps chromium webkit
            - run: pnpm test:e2e
            - if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: e2e-report
                  path: client/playwright-report
                  retention-days: 14

    visual:
        name: Regresión visual (entorno canónico)
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  package_json_file: client/package.json
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: client/.node-version
                  cache: pnpm
                  cache-dependency-path: client/pnpm-lock.yaml
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright install --with-deps chromium
            - name: Comparar con las capturas de referencia
              if: ${{ !inputs.update_snapshots }}
              run: pnpm test:visual
            - name: Regenerar las capturas de referencia
              if: ${{ inputs.update_snapshots }}
              run: pnpm test:visual:update
            - if: ${{ inputs.update_snapshots }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: visual-snapshots
                  path: client/e2e/__screenshots__
                  retention-days: 14
            - if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: visual-diff
                  path: |
                      client/test-results
                      client/playwright-report
                  retention-days: 14
