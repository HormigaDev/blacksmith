# BBEL Blacksmith · cabeceras de seguridad comunes.
#
# Ojo con la herencia de nginx: un `add_header` dentro de un `location` anula TODOS los del
# nivel superior. Por eso cada `location` que añade los suyos vuelve a incluir este archivo.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security $bbel_hsts always;
