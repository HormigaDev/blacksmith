# Aplicación de una sola página (React, Vue, Svelte, Angular…): las rutas del cliente devuelven
# index.html, que nunca se cachea; los recursos con huella, un año.
#
# Cuerpo del `server`: el agente añade lo demás (puertos, HTTPS, desafío ACME, cabeceras de
# seguridad, logs). Variables: {{root}} · {{upstream}} · {{service}} · {{server_names}} · {{primary}}.

root {{root}};
index index.html;
include snippets/blacksmith/static.conf;

location = /index.html {
    include snippets/blacksmith/security-headers.conf;
    add_header Cache-Control "no-cache" always;
}

location / {
    try_files $uri $uri/ /index.html;
}
