# Servidor de WebSocket o eventos (Socket.IO, SSE, juegos, chats): conexiones de hasta una hora
# sin búfer. El servicio escucha en {{upstream}}.
#
# Cuerpo del `server`: el agente añade lo demás (puertos, HTTPS, desafío ACME, cabeceras de
# seguridad, logs). Variables: {{upstream}} · {{root}} · {{service}} · {{server_names}} · {{primary}}.

location / {
    limit_conn blacksmith_conn 200;
    include snippets/blacksmith/proxy.conf;
    include snippets/blacksmith/websocket.conf;
    proxy_pass http://{{upstream}};
}
