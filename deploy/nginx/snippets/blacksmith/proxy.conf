# Blacksmith · proxy inverso hacia un servicio local (127.0.0.1). Va dentro de `location`,
# junto a `proxy_pass`.
proxy_http_version 1.1;

# WebSocket transparente (map $connection_upgrade en conf.d/blacksmith.conf).
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_set_header Host              $host;
# Se sobrescriben, no se encadenan: el valor que mande el cliente nunca llega al servicio.
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Request-Id      $request_id;
proxy_set_header Forwarded         "";

# Conectar con un servicio local es inmediato; si tarda, está caído. Lectura y envío: 60 s (lo
# predeterminado); websocket.conf los amplía.
proxy_connect_timeout 5s;

# El servicio no decide redirecciones a otros hosts ni filtra su versión.
proxy_redirect off;
proxy_hide_header X-Powered-By;
proxy_hide_header Server;

proxy_buffers 16 16k;
proxy_buffer_size 16k;
