# BBEL Blacksmith · archivos estáticos: compresión, caché y protección de archivos ocultos. Va
# dentro de `server`, después de `root`.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript application/json
           application/xml image/svg+xml application/manifest+json font/ttf font/otf;

# Nunca se sirven archivos ocultos (.git, .env, .htpasswd…) salvo .well-known.
location ~ /\.(?!well-known/) {
    return 404;
}

# Recursos con huella en el nombre, en las carpetas de los bundlers habituales (Vite, SvelteKit,
# Next, Astro, CRA): inmutables, un año.
location ~ ^/(?:assets|_app/immutable|_next/static|_astro|static/(?:js|css|media))/ {
    include snippets/bbel/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
    try_files $uri =404;
}

# Otros recursos (sin huella): una hora, y se revalidan después.
location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico|wasm|txt|xml)$ {
    include snippets/bbel/security-headers.conf;
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    access_log off;
    try_files $uri =404;
}
