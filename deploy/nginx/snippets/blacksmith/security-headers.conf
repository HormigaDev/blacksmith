# Blacksmith · cabeceras de seguridad comunes, y ajustes de respuesta de cada servidor de
# Blacksmith (aquí y no en conf.d: así no chocan con los de una configuración previa en `http`).
#
# Ojo con la herencia de nginx: un `add_header` dentro de un `location` anula TODOS los del
# nivel superior. Por eso cada `location` que añade los suyos vuelve a incluir este archivo.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security $blacksmith_hsts always;

server_tokens off;
limit_req_status 429;
limit_conn_status 429;
