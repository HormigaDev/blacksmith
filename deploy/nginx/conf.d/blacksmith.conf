# Blacksmith · ajustes comunes de nginx (contexto http). Lo instala deploy/nginx/install.sh
# en /etc/nginx/conf.d/; los sitios de cada servicio los genera el agente y se incluyen al final.

server_tokens off;

# WebSocket: `Connection: upgrade` solo cuando el cliente lo pide; si no, cadena vacía, que deja
# reutilizar las conexiones con el upstream (keepalive).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# HSTS solo por HTTPS (por HTTP la cabecera iría vacía, y nginx no envía cabeceras vacías). Un
# año, sin `preload` ni `includeSubDomains`: ambos afectan a dominios que este servidor no
# controla y son difíciles de revertir. Añádalos en una plantilla si todos sus subdominios van
# por HTTPS.
map $scheme $blacksmith_hsts {
    https   "max-age=31536000";
    default "";
}

# Límites por IP. `blacksmith_api` (plantilla api): ráfagas cortas de una API. `blacksmith_conn`: conexiones
# simultáneas por IP en todas las plantillas.
limit_req_zone  $binary_remote_addr zone=blacksmith_api:10m  rate=20r/s;
limit_conn_zone $binary_remote_addr zone=blacksmith_conn:10m;
limit_req_status  429;
limit_conn_status 429;

# Tamaño de los nombres de host largos (dominios con muchos subdominios).
server_names_hash_bucket_size 128;

# Sitios generados por el agente (uno por servicio). Ruta fijada por install.sh.
include @SITES_DIR@/*.conf;
